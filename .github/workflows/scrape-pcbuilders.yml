name: scrape pcbuilders.lk

# Manual only. pcbuilders.lk answers GitHub's runners with 403 on every page and
# serves a residential connection normally, so the desktop app scrapes it
# nightly at 02:30 Sri Lanka time (SHOP_SCHEDULE in src/lib/site.ts). Kept for a
# manual run, to check whether the block has lifted.
on:
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: pcbuilders.lk
      categories: gpu,psu,cpu,motherboard,ram,storage,case
      timeout_minutes: 20
    secrets: inherit
