name: normalize

# Runs after the last scraper of the night (chamacomputers starts 20:30 UTC).
# Kept on its own schedule rather than chained to the scrape workflows so that
# one retailer failing still lets the rest of the night's rows be normalized.
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 Sri Lanka time
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: normalize
      cancel-in-progress: false

    steps:
      - name: Require configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          # The model is a fallback for titles the rules cannot parse, so its
          # absence degrades the run rather than breaking it.
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set — titles the deterministic rules cannot parse will be left unmatched."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize raw listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run normalize | tee /tmp/normalize.log
          echo '### Normalize' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'resolved|wrote|curated catalog' /tmp/normalize.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The read caches all share one tag with a 30-minute revalidate, and
      # nothing else ever clears it — without this the night's prices sit behind
      # a stale cache until it happens to expire.
      - name: Clear the site's catalog cache
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET is not set — the site will serve cached prices for up to 30 more minutes."
            exit 0
          fi
          code=$(curl -s -o /tmp/revalidate.out -w '%{http_code}' -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "$SITE_URL/api/revalidate")
          echo "revalidate -> HTTP $code"
          cat /tmp/revalidate.out || true
          # A failure here costs freshness, not data; the next run tries again.
          [ "$code" = "200" ] || echo "::warning::Cache revalidation failed."
