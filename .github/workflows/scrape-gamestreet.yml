name: scrape gamestreet.lk

# 0 20 * * * UTC = 01:30 Sri Lanka time. Staggered against the other retailers so the
# scrapers never run all at once.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: gamestreet.lk
      categories: gpu,psu,cpu,motherboard,ram
      timeout_minutes: 20
    secrets: inherit
