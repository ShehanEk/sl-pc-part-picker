name: scrape chamacomputers.lk

# Manual only. chamacomputers.lk answers GitHub's runners with 403 on every
# category and serves a residential connection normally, so the desktop app
# scrapes it nightly at 02:00 Sri Lanka time (SHOP_SCHEDULE in src/lib/site.ts).
# Kept for a manual run, to check whether the block has lifted.
on:
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: chamacomputers.lk
      categories: gpu,psu,cpu,motherboard,ram,storage,case
      timeout_minutes: 30
    secrets: inherit
