name: scrape redlinetech.lk

# 30 19 * * * UTC = 01:00 Sri Lanka time. Staggered against the other retailers so the
# scrapers never run all at once.
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: redlinetech.lk
      categories: gpu,psu
      timeout_minutes: 45
    secrets: inherit
