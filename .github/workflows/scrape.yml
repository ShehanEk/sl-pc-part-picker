name: scrape

# Reusable scrape job. One caller workflow per retailer, each on its own
# schedule, so a retailer changing shape fails only its own run.
on:
  workflow_call:
    inputs:
      shop:
        description: Shop key, e.g. nanotek.lk
        required: true
        type: string
      categories:
        description: Comma-separated canonical categories
        required: false
        type: string
        default: gpu,psu
      timeout_minutes:
        required: false
        type: number
        default: 45

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Never let two runs for the same shop overlap — they would double-write
    # raw rows and double the request load on the retailer.
    concurrency:
      group: scrape-${{ inputs.shop }}
      cancel-in-progress: false

    steps:
      # Fail before touching the network. Without this the run would scrape a
      # retailer in full and only then discover it has nowhere to put the rows,
      # having spent someone else's bandwidth for nothing.
      - name: Require configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape ${{ inputs.shop }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
          SCRAPER_DELAY_MS: ${{ vars.SCRAPER_DELAY_MS }}
        run: |
          npm run scrape -- "${{ inputs.shop }}" --categories "${{ inputs.categories }}" \
            | tee /tmp/scrape.log
          echo "### ${{ inputs.shop }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/scrape.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
