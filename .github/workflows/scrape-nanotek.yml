name: scrape nanotek.lk

# 0 19 */2 * * UTC (every other day) = 00:30 Sri Lanka time. Staggered against the other retailers so the
# scrapers never run all at once.
on:
  schedule:
    - cron: '0 19 */2 * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: nanotek.lk
      categories: gpu,psu,cpu,motherboard,ram,storage,case,peripherals,laptops,consoles
      timeout_minutes: 90
    secrets: inherit
