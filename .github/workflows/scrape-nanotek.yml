name: scrape nanotek.lk

# 0 19 * * * UTC = 00:30 Sri Lanka time. Staggered against the other retailers so the
# scrapers never run all at once.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: nanotek.lk
      categories: gpu,psu
      timeout-minutes: 90
    secrets: inherit
